name: CI

# WHY THIS EXISTS. The gates in this repository were run by hand. A gate that
# only runs when somebody remembers is a gate whose last green result may be
# months old and about a compiler that no longer exists -- and merelang/mere's
# own downstream check only asks whether this code still COMPILES, which is a
# different question from whether it still answers what its oracle answers.
#
# scripts/parity.sh is a differential against a corpus with expected output,
# and it counts what it compared: "72 pairs compared, 0 mismatched, 42
# expected-different". The last number is the one that needs a machine to
# watch it -- an expected-different that quietly becomes expected-same is a
# fix nobody noticed, and one that grows is a regression wearing a permit.

on:
  push:
  pull_request:
  # The compiler moves daily and this repository does not, so a weekly run
  # catches the case where nothing here changed and it broke anyway.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # Built from main: this repository is developed against the compiler as
      # it is, not against the last release.
      - name: Check out the Mere compiler
        uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe

      - name: parity (72 pairs, with the expected-different set counted)
        run: MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" CC=clang sh scripts/parity.sh
